	<style>
		.custom-scrollbar::-webkit-scrollbar { width: 6px; }
		.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
		.custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
		.custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

		#countdown-units {

			grid-template-columns: repeat(4, 1fr);
			gap: 12px;
		}
		@media (max-width: 640px) {
			#countdown-units { gap: 6px; }
		}

		.countdown-unit {
			--fd-text: #f4f4f5;
			--fd-bg-a: #3f3f46;
			--fd-bg-b: #18181b;
			--fd-seam: rgba(0,0,0,0.55);
			--fd-glow: rgba(59,130,246,0.18);
			position: relative;
			border-radius: 1rem;
			border: 1px solid rgba(63,63,70,0.6);
			background: radial-gradient(circle at 50% 0%, rgba(59,130,246,0.08), rgba(24,24,27,0.6) 70%);
			padding: 1.25rem 0.4rem 1.5rem;
			text-align: center;
			transition: border-color 0.4s ease, box-shadow 0.4s ease;
		}
		.countdown-unit.is-urgent {
			--fd-text: #fecaca;
			--fd-bg-a: #7f1d1d;
			--fd-bg-b: #1f0a0a;
			--fd-seam: rgba(0,0,0,0.6);
			--fd-glow: rgba(239,68,68,0.25);
			border-color: rgba(239,68,68,0.4);
			box-shadow: 0 0 30px rgba(239,68,68,0.12);
		}

		.flip-group {
			display: flex;
			justify-content: center;
			gap: 0.12em;
			font-size: clamp(1.9rem, 7.5vw, 4rem);
		}

		/* One flip-digit = one split-flap card showing a single character */
		.flip-digit {
			position: relative;
			width: 0.62em;
			height: 1em;
			perspective: 6em;
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-weight: 800;
			font-variant-numeric: tabular-nums;
		}
		.flip-digit .fd-half {
			position: absolute;
			left: 0;
			width: 100%;
			height: 50%;
			overflow: hidden;
			background: linear-gradient(180deg, var(--fd-bg-a), var(--fd-bg-b));
			box-shadow: inset 0 0 12px rgba(0,0,0,0.35), 0 0 18px var(--fd-glow);
		}
		.flip-digit .fd-half span {
			position: absolute;
			left: 0;
			width: 100%;
			height: 1em;
			line-height: 1em;
			color: var(--fd-text);
			text-align: center;
		}
		.flip-digit .fd-top { top: 0; border-radius: 0.14em 0.14em 0 0; border-bottom: 1px solid var(--fd-seam); }
		.flip-digit .fd-top span { top: 0; }
		.flip-digit .fd-bottom { bottom: 0; border-radius: 0 0 0.14em 0.14em; }
		.flip-digit .fd-bottom span { top: -0.5em; }

		/* Animated flap layers, shown only mid-flip */
		.flip-digit .fd-flip {
			position: absolute;
			left: 0;
			width: 100%;
			height: 50%;
			overflow: hidden;
			background: linear-gradient(180deg, var(--fd-bg-a), var(--fd-bg-b));
			backface-visibility: hidden;
			opacity: 0;
			pointer-events: none;
		}
		.flip-digit .fd-flip span {
			position: absolute;
			left: 0;
			width: 100%;
			height: 1em;
			line-height: 1em;
			color: var(--fd-text);
			text-align: center;
		}
		.flip-digit .fd-flip-top {
			top: 0;
			border-radius: 0.14em 0.14em 0 0;
			border-bottom: 1px solid var(--fd-seam);
			transform-origin: bottom;
		}
		.flip-digit .fd-flip-top span { top: 0; }
		.flip-digit .fd-flip-bottom {
			bottom: 0;
			border-radius: 0 0 0.14em 0.14em;

		}
		.flip-digit .fd-flip-bottom span { top: -0.5em; }

		.flip-digit.is-flipping .fd-flip-bottom {

			0% { transform: rotateX(90deg); opacity: 0; }
			1% { opacity: 1; }
			100% { transform: rotateX(0deg); opacity: 1; }
		}
		@media (prefers-reduced-motion: reduce) {

	<!-- Results Day Flip Clock Countdown Engine -->
	<script>
		document.addEventListener("DOMContentLoaded", () => {
			// Target: 20 August 2026, 08:00 local time
			const target = new Date("2026-08-20T08:00:00");

			const groups = {
				days: document.getElementById("cd-days"),
				hours: document.getElementById("cd-hours"),
				minutes: document.getElementById("cd-minutes"),
				seconds: document.getElementById("cd-seconds")
			};
			const statusEl = document.getElementById("countdown-status");
			const messageEl = document.getElementById("countdown-message");
			const units = document.querySelectorAll(".countdown-unit");

			// Builds the DOM for a single split-flap digit card
			function buildFlipDigit(char) {
				const el = document.createElement("div");
				el.className = "flip-digit";
				el.dataset.value = char;
				el.innerHTML = `
					<div class="fd-half fd-top"><span>${char}</span></div>
					<div class="fd-half fd-bottom"><span>${char}</span></div>
					<div class="fd-flip fd-flip-top"><span>${char}</span></div>
					<div class="fd-flip fd-flip-bottom"><span>${char}</span></div>
				`;
				return el;
			}

			// Ensures a flip-group has one flip-digit per character, creating on first run
			function ensureDigitCount(groupEl, charCount) {
				while (groupEl.children.length < charCount) {
					groupEl.insertBefore(buildFlipDigit("0"), groupEl.firstChild);
				}
				while (groupEl.children.length > charCount) {
					groupEl.removeChild(groupEl.firstChild);
				}
			}

			// Updates one flip-digit card to a new character, animating if it changed
			function setDigit(digitEl, newChar) {
				const oldChar = digitEl.dataset.value;
				if (oldChar === newChar) return;

				const flipTop = digitEl.querySelector(".fd-flip-top span");
				const flipBottom = digitEl.querySelector(".fd-flip-bottom span");
				const staticTop = digitEl.querySelector(".fd-top span");
				const staticBottom = digitEl.querySelector(".fd-bottom span");

				// Flap layers: top flap shows the outgoing digit, bottom flap reveals the incoming one
				flipTop.textContent = oldChar;
				flipBottom.textContent = newChar;

				// Static layers update immediately underneath, revealed as the flap animates away
				staticTop.textContent = newChar;
				staticBottom.textContent = newChar;

				digitEl.classList.remove("is-flipping");
				// Force reflow so the animation replays every time
				void digitEl.offsetWidth;
				digitEl.classList.add("is-flipping");

				digitEl.dataset.value = newChar;
			}

			function renderUnit(groupEl, valueStr) {
				ensureDigitCount(groupEl, valueStr.length);
				const digits = groupEl.children;
				for (let i = 0; i < valueStr.length; i++) {
					setDigit(digits[i], valueStr[i]);
				}
			}

			function updateCountdown() {
				const now = new Date();
				const remainingMs = target - now;

				if (remainingMs > 0) {
					const secondsTotal = Math.floor(remainingMs / 1000);
					const days = Math.floor(secondsTotal / (3600 * 24));
					const hours = Math.floor((secondsTotal % (3600 * 24)) / 3600);
					const minutes = Math.floor((secondsTotal % 3600) / 60);
					const seconds = secondsTotal % 60;

					renderUnit(groups.days, String(days).padStart(2, "0"));
					renderUnit(groups.hours, String(hours).padStart(2, "0"));
					renderUnit(groups.minutes, String(minutes).padStart(2, "0"));
					renderUnit(groups.seconds, String(seconds).padStart(2, "0"));

					const isUrgent = remainingMs <= 3600 * 1000; // last hour
					units.forEach(u => u.classList.toggle("is-urgent", isUrgent));

					statusEl.innerHTML = `<i id="countdown-live-dot" class="ri-radio-button-line"></i> Live`;
					messageEl.textContent = "Counting down to Results Day — 20 Aug 2026, 08:00.";
				} else {
					renderUnit(groups.days, "00");
					renderUnit(groups.hours, "00");
					renderUnit(groups.minutes, "00");
					renderUnit(groups.seconds, "00");
					units.forEach(u => u.classList.add("is-urgent"));
					statusEl.innerHTML = `<i class="ri-checkbox-circle-line"></i> Arrived`;
					messageEl.textContent = "🎉 It's Results Day!";
				}
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		});
	</script>
