	<script>

				{ start: "2026-05-14T09:00:00", duration: 90, board: "Edexcel", subject: "Mathematics Paper 1: Non-Calculator", room: "Shearly Hall", seat: "F12" },
				{ start: "2026-05-14T13:30:00", duration: 75, board: "AQA", subject: "German Paper 3: Writing", room: "Main School Hall", seat: "E8" },
				{ start: "2026-05-18T09:00:00", duration: 105, board: "AQA", subject: "Chemistry Paper 1", room: "Shearly Hall", seat: "F14" },
				{ start: "2026-05-19T09:00:00", duration: 120, board: "OCR", subject: "English Literature Paper 2: Exploring Poetry and Shakespeare", room: "Shearly Hall", seat: "F16" },
				{ start: "2026-05-21T09:00:00", duration: 120, board: "OCR", subject: "English Language Paper 1: Communicating Information and Ideas", room: "Shearly Hall", seat: "E16" },
				{ start: "2026-05-22T09:00:00", duration: 90, board: "OCR", subject: "Economics Paper 2: National and International Economics", room: "Shearly Hall", seat: "G13" },
				{ start: "2026-06-02T09:00:00", duration: 105, board: "AQA", subject: "Physics Paper 1", room: "Shearly Hall", seat: "F14" },
				{ start: "2026-06-03T09:00:00", duration: 90, board: "Edexcel", subject: "Mathematics Paper 2: Calculator", room: "Shearly Hall", seat: "G13" },
				{ start: "2026-06-03T13:30:00", duration: 90, board: "AQA", subject: "Geography Paper 2", room: "Main School Hall", seat: "B10" },
				{ start: "2026-06-05T09:00:00", duration: 120, board: "OCR", subject: "English Language Paper 2: Exploring Effects and Impact", room: "Shearly Hall", seat: "F1" },
				{ start: "2026-06-08T09:00:00", duration: 105, board: "AQA", subject: "Biology Paper 2", room: "Shearly Hall", seat: "G10" },
				{ start: "2026-06-10T09:00:00", duration: 90, board: "Edexcel", subject: "Mathematics Paper 3: Calculator", room: "Shearly Hall", seat: "F13" },
				{ start: "2026-06-10T13:30:00", duration: 120, board: "AQA", subject: "Design and Technology", room: "Shearly Hall", seat: "D6" },
				{ start: "2026-06-11T09:00:00", duration: 90, board: "AQA", subject: "Geography Paper 3", room: "Shearly Hall", seat: "F6" },
				{ start: "2026-06-12T09:00:00", duration: 105, board: "AQA", subject: "Chemistry Paper 2", room: "Shearly Hall", seat: "G14" },
				{ start: "2026-06-15T09:00:00", duration: 105, board: "AQA", subject: "Physics Paper 2", room: "Shearly Hall", seat: "F11" }
			];
			const container = document.getElementById("exams-container");
			let hasDoneInitialScroll = false;

			// Computes overall end date of last exam
			const lastExam = exams[exams.length - 1];
			const lastExamEnd = new Date(new Date(lastExam.start).getTime() + lastExam.duration * 60000);

			let isGridView = false;

			function toggleView() {
				isGridView = !isGridView;
				const btn = document.getElementById("view-toggle");
				const icon = document.getElementById("view-toggle-icon");
				const label = document.getElementById("view-toggle-label");
				if (isGridView) {
					container.setAttribute("data-view", "grid");
					container.classList.remove("space-y-3");
					icon.className = "ri-list-check";
					label.textContent = "List View";
				} else {
					container.setAttribute("data-view", "list");
					container.classList.add("space-y-3");
					icon.className = "ri-grid-line";
					label.textContent = "Grid View";
				}
			}

			function isSameDay(d1, d2) {
				return d1.getFullYear() === d2.getFullYear() &&
					d1.getMonth() === d2.getMonth() &&
					d1.getDate() === d2.getDate();
			}

			function renderExams() {
				const now = new Date();
				const tomorrow = new Date(now);
				tomorrow.setDate(tomorrow.getDate() + 1);

				let completedCount = 0;
				container.innerHTML = "";
				let nextExamElement = null;

				exams.forEach(exam => {
					const startDate = new Date(exam.start);
					const endDate = new Date(startDate.getTime() + exam.duration * 60000);
					const isCompleted = now > endDate;
					const isActive = now >= startDate && now <= endDate;
					const isToday = isSameDay(startDate, now);
					const isTomorrow = isSameDay(startDate, tomorrow);

					if (isCompleted) completedCount++;

					const timeStr = startDate.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
					const completionStr = endDate.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
					const dateStr = startDate.toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short" });

					// Determine day-based class
					const dayClass = isToday ? 'exam-today' : isTomorrow ? 'exam-tomorrow' : '';
					const completedClass = isCompleted ? 'exam-completed' : '';

					const baseCardClass = `exam-flex flex flex-col sm:flex-row items-start sm:items-center justify-between p-4 rounded-xl border transition-all duration-300 ${dayClass} ${completedClass}`;
					const cardClass = baseCardClass + ' ' + (
						isActive ? 'border-blue-500/50 bg-blue-950/20 shadow-[0_0_15px_rgba(59,130,246,0.15)]' :
						'border-zinc-800/80 bg-zinc-900/40 hover:bg-zinc-800/60'
					) + (isCompleted ? ' opacity-35' : '');

					const examEl = document.createElement("div");
					examEl.className = cardClass;
					
					// Identify first incomplete or running exam element
					if (!isCompleted && !nextExamElement) {
						nextExamElement = examEl;
					}

					examEl.innerHTML = `
						<div class="flex-1 ${isCompleted ? 'line-through text-zinc-500' : ''}">
							<div class="flex items-center gap-3 mb-1">
								<span class="board-badge px-2.5 py-0.5 rounded-md text-xs font-bold ${isCompleted ? 'bg-zinc-800 text-zinc-500' : 'bg-blue-600/20 text-blue-400'} border ${isCompleted ? 'border-zinc-700' : 'border-blue-500/30'} uppercase tracking-wide font-mono">${exam.board}</span>
								<h3 class="exam-subject text-base font-bold ${isCompleted ? 'text-zinc-500' : 'text-gray-100'}">${exam.subject}</h3>
							</div>
							<div class="exam-meta flex flex-wrap gap-x-4 gap-y-1 text-sm ${isCompleted ? 'text-zinc-600' : 'text-gray-400'} mt-2 font-mono">
								<span class="flex items-center gap-1" title="Date"><i class="ri-calendar-line"></i> ${dateStr}</span>
								<span class="flex items-center gap-1" title="Completion Duration Frame"><i class="ri-time-line"></i> ${timeStr} – ${completionStr} (${exam.duration}m)</span>
								<span class="flex items-center gap-1" title="Location"><i class="ri-map-pin-line"></i> ${exam.room}</span>
								<span class="flex items-center gap-1" title="Seat Location"><i class="ri-user-location-line"></i> Seat ${exam.seat}</span>
							</div>
						</div>
						${isActive ? '<span class="mt-3 sm:mt-0 px-3 py-1 bg-blue-500/20 border border-blue-500/50 text-blue-400 text-xs font-bold rounded-full animate-pulse uppercase tracking-wider font-mono">In Progress</span>' : ''}
					`;
					
					container.appendChild(examEl);
				});

				// Update Progress Bar & count text
				const progressPercent = Math.round((completedCount / exams.length) * 100);
				document.getElementById("progress-bar").style.width = `${progressPercent}%`;
				document.getElementById("progress-text").textContent = `${completedCount} of ${exams.length} Exams Completed (${progressPercent}%)`;

				// Perform auto-scroll to the next relevant exam once layout settles
				if (nextExamElement && !hasDoneInitialScroll) {
					setTimeout(() => {
						container.scrollTop = nextExamElement.offsetTop - container.offsetTop - 12;
						hasDoneInitialScroll = true;
					}, 250);
				}
			}

			// live ticking countdown loop (runs every 1 second)
			function updateCountdown() {
				const now = new Date();
				const timeRemainingMs = lastExamEnd - now;
				const countdownContainer = document.getElementById("countdown-text");

				if (timeRemainingMs > 0) {
					const secondsTotal = Math.floor(timeRemainingMs / 1000);
					const days = Math.floor(secondsTotal / (3600 * 24));
					const hours = Math.floor((secondsTotal % (3600 * 24)) / 3600);
					const minutes = Math.floor((secondsTotal % 3600) / 60);
					const seconds = secondsTotal % 60;

					// Format digits
					const dText = `${days}d`;
					const hText = String(hours).padStart(2, "0") + "h";
					const mText = String(minutes).padStart(2, "0") + "m";
					const sText = String(seconds).padStart(2, "0") + "s";

					countdownContainer.innerHTML = `<i class="ri-timer-flash-line text-blue-400 animate-spin-slow"></i> ${dText} ${hText} ${mText} ${sText} until freedom!`;
				} else {
					countdownContainer.innerHTML = "🎉 All exams finished!";
				}
			}

			// Run immediate rendering and ticking loops
			renderExams();
			updateCountdown();

			// Tick countdown every second
			setInterval(updateCountdown, 1000);

			// Refresh layout once every minute for active indicators
			setInterval(renderExams, 60000);
		});
	</script>
</body>
</html>
