{{ define "main" }}
<section class="card">
    <h2 class="text-2xl font-semibold mb-4 text-gray-100">All Posts</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        {{ range .Pages }}
        <a href="{{ .RelPermalink }}" class="block card p-6 rounded-2xl bg-slate-900/55 backdrop-blur-xl border border-white/10 shadow-lg shadow-slate-950/30 transition-all duration-300 hover:-translate-y-1 hover:bg-slate-800/65 hover:border-blue-400/50 hover:shadow-2xl hover:shadow-slate-950/40 group decoration-0">
            <h3 class="text-xl font-bold text-gray-100 mb-2 group-hover:text-blue-300 transition-colors">{{ .Title }}</h3>
            <p class="text-gray-400 text-truncate-4">{{ .Summary | truncate 120 }}</p>
            <div class="mt-2 text-sm text-gray-500">{{ .Date.Format "January 2, 2006" }}</div>
        </a>
        {{ end }}
    </div>
</section>
{{ end }}
