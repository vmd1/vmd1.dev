{{ define "main" }}
<section class="card static-card">
    <h2 class="text-2xl font-semibold mb-8 text-gray-100 text-center">#{{ .Title }}</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        {{ range .Pages }}
        {{ partial "components/cards/post-card.html" (dict "page" . "summaryClass" "text-truncate-3" "summaryLength" 120) }}
        {{ end }}
    </div>
</section>
{{ end }}
