{{ define "main" }}
<div class="space-y-8">
    {{ partial "components/cards/article-card.html" (dict "page" . "linkTags" true "tocClass" "post-toc" "contentClass" "post-content") }}

    <!-- Comments Card (only if not disabled) -->
    {{ if not .Params.disableComments }}
    <div class="card static-card">
        {{ partial "components/comments.html" . }}
    </div>
    {{ end }}
</div>
{{ end }}
