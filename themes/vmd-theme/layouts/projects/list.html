{{ define "main" }}
<div class="card static-card min-h-[60vh] space-y-8">
    <header class="flex flex-col items-center gap-4 border-b border-gray-700 pb-6 text-center">
        <h1 class="text-3xl font-bold text-gray-100">{{ .Title }}</h1>
        <a href="https://github.com/vmd1" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 text-sm text-gray-400 hover:text-gray-100 transition-colors">
            <i class="ri-github-line text-lg"></i>
            <span>View on GitHub</span>
        </a>
    </header>

    <div id="projects-status" class="rounded-xl border border-slate-700 bg-slate-900/50 px-4 py-3 text-sm text-gray-400">
        Loading GitHub repositories...
    </div>

    <div id="projects-grid" class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const statusEl = document.getElementById('projects-status');
        const gridEl = document.getElementById('projects-grid');
        const username = 'vmd1';

        const formatDate = (value) => {
            const date = new Date(value);
            return new Intl.DateTimeFormat('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            }).format(date);
        };

        const renderError = (message) => {
            if (statusEl) {
                statusEl.textContent = message;
                statusEl.classList.add('text-red-300', 'border-red-500/30', 'bg-red-500/10');
            }
        };

        try {
            const response = await fetch(`https://api.github.com/users/${username}/repos?sort=pushed&per_page=100`);
            if (!response.ok) {
                throw new Error('GitHub API request failed');
            }

            const repos = (await response.json())
                .filter((repo) => !repo.fork);

            if (statusEl) {
                statusEl.remove();
            }

            if (!repos.length) {
                gridEl.innerHTML = '<p class="text-gray-400">No repositories found.</p>';
                return;
            }

            gridEl.innerHTML = repos.map((repo) => {
                const description = repo.description || 'No description available.';
                const language = repo.language ? `<span class="inline-flex items-center rounded-full border border-blue-400/20 bg-blue-500/10 px-3 py-1 text-xs text-blue-200">${repo.language}</span>` : '';

                return `
                    <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer" class="group block rounded-2xl border border-white/10 bg-slate-900/55 p-6 shadow-lg shadow-slate-950/20 transition-all duration-300 hover:-translate-y-1 hover:border-blue-400/50 hover:bg-slate-800/70 hover:shadow-2xl hover:shadow-slate-950/40">
                        <div class="flex items-start justify-between gap-4">
                            <div>
                                <h2 class="text-xl font-semibold text-gray-100 transition-colors group-hover:text-blue-300">${repo.name}</h2>
                                <p class="mt-1 text-sm text-gray-500">${repo.full_name}</p>
                            </div>
                            <i class="ri-external-link-line text-lg text-gray-500 transition-colors group-hover:text-blue-300"></i>
                        </div>
                        <p class="mt-4 text-sm leading-relaxed text-gray-300/90">${description}</p>
                        <div class="mt-5 flex flex-wrap items-center gap-2 text-xs text-gray-400">
                            ${language}
                            <span class="inline-flex items-center gap-1 rounded-full border border-white/10 bg-slate-800/60 px-3 py-1">
                                <i class="ri-star-line"></i>
                                ${repo.stargazers_count}
                            </span>
                            <span class="inline-flex items-center gap-1 rounded-full border border-white/10 bg-slate-800/60 px-3 py-1">
                                <i class="ri-git-repository-commits-line"></i>
                                ${repo.forks_count}
                            </span>
                            <span class="inline-flex items-center gap-1 rounded-full border border-white/10 bg-slate-800/60 px-3 py-1">
                                <i class="ri-time-line"></i>
                                Updated ${formatDate(repo.pushed_at)}
                            </span>
                        </div>
                    </a>
                `;
            }).join('');
        } catch (error) {
            console.error('Error loading projects:', error);
            renderError('Failed to load projects from GitHub. Please try again later.');
            gridEl.innerHTML = '';
        }
    });
</script>
{{ end }}
