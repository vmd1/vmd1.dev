            <a href="{{ "projects" | relURL }}" class="flex items-center gap-2 px-6 py-3 rounded-xl bg-slate-800/50 hover:bg-slate-700 hover:text-blue-400 border border-slate-700 hover:border-blue-500/50 transition-all duration-300 group">

        </div>
