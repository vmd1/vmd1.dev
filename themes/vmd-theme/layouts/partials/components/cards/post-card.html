<a href="{{ .page.RelPermalink }}" class="block card p-6 rounded-2xl bg-zinc-950/55 backdrop-blur-xl border border-white/10 shadow-lg shadow-black/30 transition-all duration-300 hover:-translate-y-1 hover:bg-zinc-900/65 hover:border-white/20 hover:shadow-2xl hover:shadow-black/40 group decoration-0">
    <h3 class="text-xl font-bold text-gray-100 mb-2 group-hover:text-gray-100 transition-colors">{{ .page.Title }}</h3>
    <p class="text-gray-400 {{ .summaryClass | default "text-truncate-3" }}">{{ .page.Summary | truncate (.summaryLength | default 120) }}</p>
    <div class="mt-2 text-sm text-gray-500">{{ .page.Date.Format "January 2, 2006" }}</div>
</a>
