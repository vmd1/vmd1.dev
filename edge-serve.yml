version: "1"

build:
  engine: node
  output_dir: dist

serving:
  error_pages:
    404: /404.html
    500: /500.html
    502: /500.html
    503: /500.html
    504: /500.html
  headers:
    - pattern: "^/_astro/"
      headers:
        Cache-Control: "public, max-age=31536000, immutable"
    - pattern: "^/(css/|favicon\\.ico$)"
      headers:
        Cache-Control: "public, max-age=86400"
  routes:
    - path: = /.well-known/webfinger
      content_type: application/jrd+json
      cors: true
      return:
        status: 200
        body:
          subject: "acct:viv@vmd1.dev"
          links:
            - rel: "http://openid.net/specs/connect/1.0/issuer"
              href: "https://authentik.kmnet.uk/application/o/tailscale-vmd1-dev/"
    - path: = /.well-known/matrix/client
      content_type: application/json
      cors: true
      return:
        status: 200
        body:
          m.homeserver:
            base_url: "https://matrix.vmd1.dev"
          org.matrix.msc4143.rtc_foci:
            - type: livekit
              livekit_service_url: "https://call.vmd1.dev"
    - path: = /.well-known/matrix/server
      content_type: application/json
      cors: true
      return:
        status: 200
        body:
          m.server: "federation.vmd1.dev:443"
    - path: = /.well-known/matrix/support
      content_type: application/json
      cors: true
      return:
        status: 200
        body:
          contacts:
            - email_address: "me@vmd1.dev"
              matrix_id: "@vivaan:vmd1.dev"
              role: m.role.admin
    - path: = /.well-known/matrix/mautrix
      content_type: application/json
      cors: true
      return:
        status: 200
        body:
          fi.mau.bridges:
            - "https://api.vmd1.dev/v1/bridges/slack"
            - "https://api.vmd1.dev/v1/bridges/signal"
            - "https://api.vmd1.dev/v1/bridges/telegram"
            - "https://api.vmd1.dev/v1/bridges/whatsapp"
            - "https://api.vmd1.dev/v1/bridges/twitter"
            - "https://api.vmd1.dev/v1/bridges/gmessages"
            - "https://api.vmd1.dev/v1/bridges/discord"
            - "https://api.vmd1.dev/v1/bridges/linkedin"
            - "https://api.vmd1.dev/v1/bridges/meta"
            - "https://api.vmd1.dev/v1/bridges/googlechat"
