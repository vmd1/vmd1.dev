# Map to strip "www." prefix so Nginx checks the correct directory for both variants
map $host $site_host {
    ~^www\.(.+)$ $1;
    default $host;
}

# 1. CATCH-ALL BLOCK (Dynamically serves any new hostnames located in sites/HOSTNAME/)
server {
    listen       80 default_server;
    server_name  _;

    # Dynamically point root to the directory matching the hostname
    root   /usr/share/nginx/html/sites/$site_host;
    index  index.html index.htm;
    
    error_page 404 /vmd1_404.html;
    error_page 500 502 503 504 /50x.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /vmd1_404.html {
        alias /usr/share/nginx/html/sites/vmd1.dev/404.html;
        internal;
    }

    location = /health {
        access_log off;
        add_header 'Content-Type' 'text/plain';
        return 200 "OK\n";
    }

    location = /50x.html {
        alias /usr/share/nginx/html/sites/$site_host/500/index.html;
    }
}

# 2. VMD1.DEV BLOCK (Preserving well-known / matrix logic)
server {
    listen       80;
    server_name  vmd1.dev www.vmd1.dev;

    root   /usr/share/nginx/html/sites/$site_host;
    index  index.html index.htm;
    
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        add_header 'Content-Type' 'text/plain';
        return 200 "OK\n";
    }

    location = /.well-known/webfinger {
        default_type application/jrd+json;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"links":[{"href":"https://authentik.kmnet.uk/application/o/tailscale-vmd1-dev/","rel":"http://openid.net/specs/connect/1.0/issuer"}],"subject":"acct:viv@vmd1.dev"}';
    }

    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"m.homeserver":{"base_url":"https://matrix.vmd1.dev"},"org.matrix.msc4143.rtc_foci":[{"type":"livekit","livekit_service_url":"https://call.vmd1.dev"}]}';
    }

    location = /.well-known/matrix/server {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"m.server":"federation.vmd1.dev:443"}';
    }

    location = /.well-known/matrix/support {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"contacts":[{"email_address":"me@vmd1.dev","matrix_id":"@vivaan:vmd1.dev","role":"m.role.admin"}]}';
    }

    location = /.well-known/matrix/mautrix {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"fi.mau.bridges":["https://api.vmd1.dev/v1/bridges/slack","https://api.vmd1.dev/v1/bridges/signal","https://api.vmd1.dev/v1/bridges/telegram","https://api.vmd1.dev/v1/bridges/whatsapp","https://api.vmd1.dev/v1/bridges/twitter","https://api.vmd1.dev/v1/bridges/gmessages","https://api.vmd1.dev/v1/bridges/discord","https://api.vmd1.dev/v1/bridges/linkedin","https://api.vmd1.dev/v1/bridges/meta","https://api.vmd1.dev/v1/bridges/googlechat"]}';
    }

    location = /50x.html {
        alias /usr/share/nginx/html/sites/$site_host/500/index.html;
    }
